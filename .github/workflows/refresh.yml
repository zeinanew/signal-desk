name: Refresh and publish

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 08:00 Riyadh, every day
  workflow_dispatch:       # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect and summarize
        run: python scripts/collect.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODELS: ${{ vars.XAI_MODELS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save new data to the repo
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh feed $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
