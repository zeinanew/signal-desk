name: Collect and refresh

# No schedule trigger: the daily collect+commit now runs from a local Windows Task Scheduler job
# (scripts/refresh_local.ps1) instead, to avoid two independent schedulers racing to regenerate
# and push data/*.json at the same time (which produces unresolvable merge conflicts, since two
# independently-regenerated JSON snapshots rarely line-merge cleanly). This workflow still runs
# on demand and whenever sources.json (or any non-data file) changes.
on:
  workflow_dispatch:       # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect and summarize
        run: python scripts/collect.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODELS: ${{ vars.GROQ_MODELS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save new data to the repo
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Refresh feed $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash && git push
